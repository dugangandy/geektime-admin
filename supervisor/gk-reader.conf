; 极客时间离线阅读器 · supervisord 程序配置
; 通过 ~/.supervisor/conf.d/geektime-admin.conf（软链接）挂到已经在跑的 supervisord，
; 与 xinghai-fm 共用同一个 socket：
;   supervisorctl -c "/Volumes/Macintosh HD/Users/app/XinghaiFm/supervisor/supervisord.conf" status
;
; 被管理的进程：serve.command（前台常驻）
;   它自己负责：本地 127.0.0.1:8888 静态服务 + SSH 反向隧道 -R 8888:127.0.0.1:8888
;   隧道断线由脚本内部重连（指数退避，最多 10 次）；只有脚本整个退出才由 supervisor 再拉
;
; 若公网 8888 已被别的实例（比如手动双击 serve.command）占用，脚本会打印提示后以 0 退出，
; 此时 gk-reader 会进入 FATAL。先停掉那个实例再 supervisorctl start gk-reader。

[program:gk-reader]
command=/bin/bash "/Volumes/Macintosh HD/Users/app/geektime-admin/serve.command"
directory=/Volumes/Macintosh HD/Users/app/geektime-admin
autostart=true
autorestart=unexpected
; 正常情况下脚本进 connect 循环后一直前台运行，10 秒内退出即视为启动失败
startsecs=10
startretries=3
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.supervisor/logs/gk-reader.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="%(ENV_HOME)s",PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin",LANG="zh_CN.UTF-8",PYTHON="/usr/bin/python3"
