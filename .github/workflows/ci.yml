name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # ubuntu-latest 已迁到 26.04，而 setup-python 没有 3.9 的 26.04 构建，故钉 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Byte-compile all modules
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m unittest test_autobuild test_serve_auth test_mobile_api test_data_dir -v

  android:
    name: Android assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 Ubuntu 镜像自带 Android SDK；直接用自带 sdkmanager，
      # 不引第三方 setup-android action（在 26.04 上实测失败）。
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n1)" || true
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK"; exit 1; }
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 按 npm run dist:apk 的命名规则整理产物，便于直接下载安装
      - name: Stage APK
        run: |
          VERSION="$(sed -n 's/^versionName=//p' android/version.properties | tr -d '\r')"
          test -n "$VERSION" || VERSION="dev"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/GeekTimeReader-$VERSION-debug.apk"
          ls -lh out

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: GeekTimeReader-debug
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  # 打 tag（v1.2.3 / 1.2.3）时把上面构建好的 APK 附到 GitHub Release；
  # 复用 android job 的产物，不重复编译。needs 保证测试与编译都过了才发。
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GeekTimeReader-debug
          path: out

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh out
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --title "$TAG" --generate-notes
          fi
